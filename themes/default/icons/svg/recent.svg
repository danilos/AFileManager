<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 100 100"
   width="100%"
   height="100%"
   version="1.1"
   id="svg2"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs2" />
  <!-- Outer Clock Circle (Blue & Magenta) -->
  <circle
     cx="50"
     cy="50"
     r="34"
     stroke="#48529A"
     stroke-width="12"
     fill="none"
     id="circle1" />
  <!-- Hour Hand (Orange) -->
  <line
     x1="50"
     y1="50"
     x2="50"
     y2="30"
     stroke="#F6962A"
     stroke-width="10"
     stroke-linecap="round"
     id="line1" />
  <!-- Minute Hand (Yellow) -->
  <line
     x1="50"
     y1="50"
     x2="66"
     y2="50"
     stroke="#FAD13A"
     stroke-width="10"
     stroke-linecap="round"
     id="line2" />
  <!-- Center Point (Red) -->
  <circle
     cx="50"
     cy="50"
     r="6"
     fill="#EE544B"
     id="circle2" />
</svg>
